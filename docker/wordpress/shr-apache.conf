ServerTokens Prod
ServerSignature Off
TraceEnable Off

# The scanner has one public path. Every route under it needs the API key.
ProxyRequests Off
ProxyPass /scanner/api/ http://scanner:8080/api/ timeout=30
ProxyPassReverse /scanner/api/ http://scanner:8080/api/

# Report and dashboard URLs carry secrets, so they stay out of the access log.
SetEnvIf Request_URI "^/report/" dontlog
SetEnvIf Request_URI "^/dashboard/" dontlog
SetEnvIf Request_URI "^/wp-json/shr/" dontlog
